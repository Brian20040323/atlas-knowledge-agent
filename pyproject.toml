[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "atlas-knowledge-agent"
version = "0.3.0"
description = "Atlas: local knowledge-assistant Agent (FastAPI + SSE + ReAct + hybrid RAG + Trace)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Brian20040323" }]
keywords = ["agent", "rag", "fastapi", "react-agent", "mcp", "llm", "knowledge-base"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    "httpx==0.28.1",
    "pydantic==2.11.3",
    "pydantic-settings==2.8.1",
    "python-dotenv==1.1.0",
    "sse-starlette==2.2.1",
    "tzdata==2025.2",
    "sqlalchemy==2.0.40",
    "aiosqlite==0.21.0",
    "pypdf==5.4.0",
    "python-multipart==0.0.20",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "python-pptx>=1.0.0",
    "Pillow>=10.0.0",
    "pytesseract>=0.3.10",
    "pypdfium2>=4.30.0",
    "duckduckgo-search==8.1.1",
    "ddgs>=9.0.0",
    "faster-whisper>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.24", "ruff>=0.3"]

[project.scripts]
atlas = "app.main:main"

[project.urls]
Repository = "https://github.com/Brian20040323/atlas-knowledge-agent"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"