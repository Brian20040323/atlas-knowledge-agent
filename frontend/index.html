<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atlas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/styles.css?v=20260729graphB" />
  </head>
  <body>
    <div class="app" id="appShell">
      <div class="bg-scene" aria-hidden="true"></div>
      <div class="bg-veil" aria-hidden="true"></div>

      <aside class="sidebar" id="sidebar">
        <div class="sidebar-top">
          <a class="logo" href="/" title="Atlas">
            <span class="logo-mark" aria-hidden="true">A</span>
            <span class="logo-text">Atlas</span>
          </a>
          <div class="sidebar-top-actions">
            <button type="button" class="icon-btn" id="themeBtn" title="切换浅色/深色" aria-label="切换浅色/深色">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.6"/><path d="M12 2v2.2M12 19.8V22M2 12h2.2M19.8 12H22M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M19.1 4.9l-1.6 1.6M6.5 17.5l-1.6 1.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            </button>
            <button type="button" class="icon-btn" id="sidebarToggle" title="收起侧栏" aria-label="收起侧栏" aria-expanded="true">
              <svg class="ico-collapse" width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M15 6 9 12l6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>

        <nav class="nav-list">
          <button type="button" class="nav-item" id="navChat" title="新建对话">
            <svg class="nav-ico" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
            <span class="nav-label">新建对话</span>
          </button>
          <button type="button" class="nav-item" id="newChatBtn" title="New chat" hidden aria-hidden="true"></button>
          <button type="button" class="nav-item" id="importBtn" title="导入文件">
            <svg class="nav-ico" viewBox="0 0 24 24" fill="none"><path d="M12 4v10M8.5 10.5 12 14l3.5-3.5M5 18h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="nav-label">导入</span>
          </button>
          <button type="button" class="nav-item" id="traceBtn" title="运行记录">
            <svg class="nav-ico" viewBox="0 0 24 24" fill="none"><path d="M5 7h14M5 12h9M5 17h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            <span class="nav-label">记录</span>
          </button>
        </nav>

        <div class="sidebar-section sidebar-user" id="userBar">
          <div class="user-chip" id="userChip" hidden>
            <span class="user-name" id="userName"></span>
            <button type="button" class="btn-ghost user-logout" id="logoutBtn" title="退出登录">退出</button>
          </div>
        </div>

        <div class="sidebar-section sidebar-chats">
          <div class="section-label">我的对话</div>
          <div class="conv-list" id="convList"></div>
        </div>

        <div class="sidebar-section sidebar-kb">
          <button type="button" class="section-label kb-toggle" id="kbToggle" aria-expanded="false">
            我的知识库
            <span class="kb-caret">▾</span>
          </button>
          <div class="kb-drawer" id="kbDrawer" hidden>
            <div class="kb-tabs" role="tablist">
              <button type="button" class="kb-tab" data-panel="write" role="tab">手写</button>
              <button type="button" class="kb-tab" data-panel="import" role="tab">导入</button>
              <button type="button" class="kb-tab active" data-panel="docs" role="tab">文档</button>
            </div>
            <div class="kb-panel" id="panel-write" role="tabpanel" hidden>
              <form class="learn-form" id="learnForm">
                <input id="learnTitle" placeholder="标题" required autocomplete="off" />
                <textarea id="learnContent" rows="3" placeholder="写入条文…" required></textarea>
                <button type="submit" class="btn-secondary full">保存</button>
              </form>
            </div>
            <div class="kb-panel" id="panel-import" role="tabpanel" hidden>
              <div class="import-zone" id="importZone">
                <p class="import-desc">PDF / Word / zip / 图片 / 文本</p>
                <button type="button" class="btn-secondary full" id="uploadBtn">选择文件</button>
                <input id="fileCaption" placeholder="可选说明" autocomplete="off" />
                <p class="upload-status" id="uploadStatus"></p>
              </div>
              <input type="file" id="voiceSampleInput" accept="audio/*,.m4a,.mp3,.wav,.ogg" hidden />
              <button type="button" class="btn-ghost full" id="voiceSampleBtn">上传音色</button>
              <p class="upload-status" id="voiceSampleStatus"></p>
              <p class="import-desc" id="ttsHint" hidden></p>
            </div>
            <div class="kb-panel active" id="panel-docs" role="tabpanel">
              <div class="knowledge-list" id="knowledgeList"></div>
            </div>
          </div>
        </div>

        <span class="status-dot" id="statusDot" hidden></span>
        <span id="modeBadge" hidden>连接中</span>
      </aside>

      <div class="main">
        <button type="button" class="icon-btn menu-fab" id="menuBtn" aria-label="打开侧栏" title="打开侧栏">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </button>
        <button type="button" class="icon-btn rail-expand" id="railExpandBtn" aria-label="展开侧栏" title="展开侧栏" hidden>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>

        <div class="chat-scroll" id="chatScroll">
          <div class="chat-inner" id="chat"></div>
        </div>

        <div class="drop-overlay" id="dropOverlay" hidden>
          <p>松开以导入知识库</p>
          <small>PDF · Word · Excel · PPT · Image · TXT</small>
        </div>

        <div class="composer-dock">
          <div class="composer-shell" id="sysBar">
            <form class="composer" id="form">
              <div class="composer-attach" id="composerAttach" hidden></div>
              <textarea id="input" rows="1" placeholder="询问制度、文档或业务问题…" required></textarea>
              <div class="composer-toolbar">
                <div class="toolbar-left">
                  <button type="button" class="btn-tool btn-plus" id="attachBtn" title="导入文件" aria-label="导入文件">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                  </button>
                  <label class="meta-switch meta-switch-quiet" title="需要更细致分析时开启" aria-label="细致分析">
                    <input type="checkbox" id="deepThink" />
                    <span>细致</span>
                  </label>
                </div>
                <div class="toolbar-right">
                  <button type="button" class="btn-tool" id="voiceBtn" title="语音输入" aria-label="语音输入">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                      <path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Z" stroke="currentColor" stroke-width="1.8"/>
                      <path d="M5 11a7 7 0 0 0 14 0M12 18v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                    </svg>
                  </button>
                  <button type="button" class="btn-tool" id="speakBtn" title="朗读回答" aria-label="朗读回答">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                      <path d="M4 9v6h3l5 4V5L7 9H4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                      <path d="M16 9.5a3.5 3.5 0 0 1 0 5M18.5 7a6 6 0 0 1 0 10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                    </svg>
                  </button>
                  <button type="button" id="stopGen" class="btn-stop" aria-label="停止生成" title="停止" hidden>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>
                  </button>
                  <button type="submit" id="send" class="btn-send" aria-label="发送">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                      <path d="M12 19V5M5 12l7-7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <div class="auth-overlay" id="authOverlay" hidden>
      <form class="auth-card" id="authForm">
        <h1>Atlas</h1>
        <p class="auth-sub" id="authSub">登录后，对话和知识库仅自己可见</p>
        <p class="auth-err" id="authErr" hidden></p>
        <input id="authUsername" name="username" autocomplete="username" placeholder="用户名" required minlength="3" maxlength="32" />
        <input id="authPassword" name="password" type="password" autocomplete="current-password" placeholder="密码" required minlength="6" maxlength="128" />
        <input id="authDisplay" name="display" placeholder="显示名（注册可选）" maxlength="100" hidden />
        <input id="authInvite" name="invite" placeholder="邀请码（如需要）" maxlength="64" hidden />
        <button type="submit" id="authSubmit">登录</button>
        <button type="button" class="auth-switch" id="authSwitch">没有账号？注册</button>
      </form>
    </div>

    <input
      type="file"
      id="fileInput"
      accept=".pdf,.doc,.docx,.pptx,.xlsx,.zip,.png,.jpg,.jpeg,.webp,.gif,.bmp,.tif,.tiff,.txt,.md,.markdown,.csv,.json,.html,.htm,.rtf,image/*"
      multiple
      hidden
    />
    <div class="sidebar-backdrop" id="sidebarBackdrop" hidden></div>

    <!-- Atlas 桌宠：制度导航员（指南针 + 轨道） -->
    <aside class="atlas-pet" id="atlasPet" data-state="idle" aria-label="Atlas 桌宠">
      <div class="pet-bubble" id="petBubble" hidden>
        <span id="petBubbleText">有据才说，无据就明说。</span>
      </div>
      <button type="button" class="pet-face" id="petFace" title="拖动移动 · 单击互动 · 双击打开面板">
        <svg class="pet-svg" viewBox="0 0 64 64" aria-hidden="true">
          <defs>
            <radialGradient id="petCore" cx="50%" cy="45%" r="55%">
              <stop offset="0%" stop-color="#5eead4"/>
              <stop offset="70%" stop-color="#0f766e"/>
              <stop offset="100%" stop-color="#0a1218"/>
            </radialGradient>
          </defs>
          <circle class="pet-orbit" cx="32" cy="32" r="26" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.35"/>
          <ellipse class="pet-track" cx="32" cy="32" rx="26" ry="10" fill="none" stroke="#5eead4" stroke-width="1.15" opacity="0.75" transform="rotate(-28 32 32)"/>
          <circle class="pet-sat" cx="52" cy="22" r="3.2" fill="#ecfdf5"/>
          <circle cx="32" cy="32" r="14" fill="url(#petCore)" stroke="#d1fae5" stroke-width="1.2"/>
          <path class="pet-needle" d="M32 20 L35.2 32 L32 44 L28.8 32 Z" fill="#ecfdf5" opacity="0.95"/>
          <circle cx="32" cy="32" r="2.2" fill="#0a1218" stroke="#ecfdf5" stroke-width="1"/>
        </svg>
        <span class="pet-nameplate">Atlas</span>
        <span class="pet-pulse" aria-hidden="true"></span>
      </button>
      <p class="pet-drag-hint" id="petDragHint">拖动 · 单击 · 双击面板</p>
      <div class="pet-panel" id="petPanel" hidden>
        <div class="pet-head">
          <div>
            <strong>Atlas</strong>
            <span class="pet-role">制度导航员</span>
          </div>
          <span class="pet-status" id="petStatus">待命</span>
        </div>
        <p class="pet-hint">企业知识助手：检索制度 → 综合作答 → 相互复核。有库内证据才断言。</p>
        <div class="pet-agents" id="petAgents">
          <div class="pet-agent" data-role="retrieve"><span class="pa-dot"></span>检索官</div>
          <div class="pet-agent" data-role="draft"><span class="pa-dot"></span>执笔官</div>
          <div class="pet-agent" data-role="review"><span class="pa-dot"></span>复核官</div>
        </div>
        <label class="pet-collab">
          <input type="checkbox" id="collabToggle" checked />
          开启三角色协作监督
        </label>
      </div>
    </aside>

    <script src="/static/app.js?v=20260729graphB"></script>
  </body>
</html>
