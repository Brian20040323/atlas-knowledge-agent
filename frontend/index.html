<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atlas · 企业助手</title>
    <link rel="stylesheet" href="/static/styles.css?v=20260721d" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-top">
          <a class="logo" href="/">
            <span class="logo-mark" aria-hidden="true"></span>
            <span class="logo-text">Atlas</span>
          </a>
          <button type="button" class="btn-ghost" id="newChatBtn" title="新对话">新对话</button>
        </div>

        <div class="sidebar-section sidebar-convs">
          <div class="section-label">最近对话</div>
          <div class="conv-list" id="convList"></div>
        </div>

        <div class="sidebar-section">
          <div class="section-label">制度库</div>
          <form class="learn-form" id="learnForm">
            <input id="learnTitle" placeholder="标题" required autocomplete="off" />
            <textarea id="learnContent" rows="3" placeholder="写入一条可检索的条文或要点…" required></textarea>
            <button type="submit" class="btn-secondary">保存</button>
          </form>

          <div class="upload-box upload-box-primary">
            <div class="section-label">导入文件</div>
            <p class="upload-hint">PDF · Word · Excel · PPT · 图片 · TXT（≤20MB，可多选）</p>
            <button type="button" class="btn-secondary full" id="uploadBtn">选择或拖入文件</button>
            <input id="fileCaption" placeholder="可选说明（如：差旅制度扫描件）" autocomplete="off" />
            <p class="upload-status" id="uploadStatus"></p>
          </div>

          <div class="knowledge-list" id="knowledgeList"></div>

          <div class="upload-box">
            <div class="section-label">音色</div>
            <p class="upload-hint" id="ttsHint">
              上传 10–30 秒清晰中文录音，用于朗读回答。
            </p>
            <input type="file" id="voiceSampleInput" accept="audio/*,.m4a,.mp3,.wav,.ogg" hidden />
            <button type="button" class="btn-ghost full" id="voiceSampleBtn">上传声音样本</button>
            <p class="upload-status" id="voiceSampleStatus"></p>
          </div>
        </div>

        <div class="sidebar-foot">
          <span class="status-dot" id="statusDot"></span>
          <span id="modeBadge">连接中</span>
        </div>
      </aside>

      <div class="main">
        <div class="sys-bar" id="sysBar">
          <span class="sys-stat"><span class="sys-dot" id="sysDot"></span><span id="sysModel">连接中</span></span>
          <span class="sys-sep"></span>
          <span class="sys-stat" id="sysKB">制度库 —</span>
          <span class="sys-sep"></span>
          <button type="button" class="sys-link" id="traceBtn" title="最近运行记录">运行记录</button>
          <span style="flex:1"></span>
          <button type="button" class="sys-link" id="themeBtn" title="切换外观">外观</button>
        </div>
        <header class="main-bar">
          <button type="button" class="btn-icon mobile-only" id="menuBtn" aria-label="打开侧栏">菜单</button>
          <div class="main-bar-title">企业助手</div>
          <button type="button" class="btn-ghost" id="importBtn" title="导入 PDF / Word / 图片等到知识库">
            导入文件
          </button>
          <label class="switch">
            <input type="checkbox" id="deepThink" />
            <span class="switch-ui" aria-hidden="true"></span>
            <span class="switch-label">细想</span>
          </label>
        </header>

        <div class="chat-scroll" id="chatScroll">
          <div class="chat-inner" id="chat"></div>
          <div class="drop-overlay" id="dropOverlay" hidden>
            <p>松开以导入到知识库</p>
            <small>PDF / Word / Excel / PPT / 图片 / 文本</small>
          </div>
        </div>

        <div class="composer-wrap">
          <form class="composer" id="form">
            <button type="button" class="btn-tool" id="attachBtn" title="导入文件到知识库" aria-label="导入文件">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M21.44 11.05 12.7 19.78a5.25 5.25 0 0 1-7.42-7.42l9.19-9.2a3.5 3.5 0 0 1 4.95 4.95l-9.2 9.19a1.75 1.75 0 0 1-2.47-2.47l8.13-8.14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <button type="button" class="btn-tool" id="voiceBtn" title="语音输入" aria-label="语音输入">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Z" stroke="currentColor" stroke-width="1.8"/>
                <path d="M5 11a7 7 0 0 0 14 0M12 18v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
            </button>
            <textarea
              id="input"
              rows="1"
              placeholder="问问住宿费上限，或点左侧回形针导入文件…"
              required
            ></textarea>
            <button type="button" class="btn-tool" id="speakBtn" title="朗读回答" aria-label="朗读回答">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M4 9v6h3l5 4V5L7 9H4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                <path d="M16 9.5a3.5 3.5 0 0 1 0 5M18.5 7a6 6 0 0 1 0 10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
            </button>
            <button type="submit" id="send" class="btn-send" aria-label="发送">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </form>
          <p class="composer-hint">Enter 发送 · 回形针或拖拽可导入 PDF / Word / 图片</p>
        </div>
      </div>
    </div>
    <input
      type="file"
      id="fileInput"
      accept=".pdf,.doc,.docx,.pptx,.xlsx,.png,.jpg,.jpeg,.webp,.gif,.bmp,.tif,.tiff,.txt,.md,.markdown,.csv,.json,.html,.htm,.rtf,image/*"
      multiple
      hidden
    />
    <div class="sidebar-backdrop" id="sidebarBackdrop" hidden></div>
    <script src="/static/app.js?v=20260721d"></script>
  </body>
</html>
