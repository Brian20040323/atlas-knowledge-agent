version: "3.9"

services:
  atlas:
    build:
      context: ../..  # repo root
      dockerfile: deploy/atlas/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - atlas_data:/app/data
    env_file:
      - ../../.env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    restart: unless-stopped

volumes:
  atlas_data:
