# Atlas agent golden cases — routing + retrieval + citation + limits (P1)
# + observability (P2) + optional vector (P3) + optional graph (P4)
# + T1 policy goldens (企业制度问答：命中 / 引用 / 缺失拒绝)
cases:
  - id: agent_roadmap
    query: agent开发需要学习哪些知识
    expected_intent: local
    must_hit_title_any: ["Agent", "agent", "知识地图"]
    forbid_phrases: ["【直接回答】", "本轮使用了联网检索"]
    must_answer_contain_any: ["**参考**"]
    must_answer_match_any: ["document_id="]

  - id: citation_refs
    query: Agent 开发知识地图包含什么
    expected_intent: local
    must_hit_title_any: ["Agent", "agent", "知识地图"]
    must_answer_contain_any: ["**参考**"]
    must_answer_match_any: ["document_id="]
    forbid_phrases: ["【依据】", "【直接回答】"]

  - id: empty_result_answer
    query: 完全虚构冷门词条ZXQWERTY999不存在于库
    expect_max_hits: 0
    must_answer_contain_any: ["不足以", "补充", "记住：", "自主学习", "联网"]
    forbid_phrases: ["【直接回答】"]

  # --- T1 制度金标准（垂直场景：差旅报销）---
  - id: policy_reimburse_cap
    category: hit
    query: 差旅住宿费上限是多少？
    expected_intent: local
    must_hit_title_any: ["差旅报销"]
    must_answer_contain_any: ["**参考**"]
    must_answer_contain_all: ["500"]
    must_answer_match_any: ["document_id="]
    forbid_phrases: ["【直接回答】", "本轮使用了联网检索"]
    notes: "种子文档《差旅报销制度》须含住宿费上限 500 元/晚"

  - id: policy_reimburse_citation
    category: hit
    query: 差旅报销需要哪些附件？
    expected_intent: local
    must_hit_title_any: ["差旅报销"]
    must_answer_contain_any: ["**参考**"]
    must_answer_contain_all: ["发票"]
    must_answer_match_any: ["document_id="]
    forbid_phrases: ["【依据】", "【直接回答】"]
    notes: "有据作答：附件条款须可追溯 document_id"

  - id: policy_missing_medical
    category: missing
    query: 完全虚构制度条款ZXQMED999股权激励行权税率是多少
    expected_intent: local
    expect_max_hits: 0
    must_not_plan_step: web_search
    must_answer_contain_any: ["不足以", "补充", "记住："]
    must_answer_contain_all: ["不能凭推测"]
    forbid_phrases: ["【直接回答】", "一般为", "通常是", "估计", "本轮使用了联网检索"]
    notes: "T2：制度缺失须 local 拒绝，禁止自动 research/web"

  - id: policy_empty_stays_local
    category: missing
    query: 本公司年假最长可休几天ZXQLEAVE001
    expected_intent: local
    expect_max_hits: 0
    must_not_plan_step: research_topics
    must_answer_contain_any: ["不足以", "不能凭推测"]
    forbid_phrases: ["一般为", "通常是", "估计"]
    notes: "T2：考勤/年假类空库不得转 research"

  - id: policy_no_auto_web
    category: missing
    query: 考勤迟到罚款标准是多少ZXQATT001
    expected_intent: local
    must_not_plan_step: web_search
